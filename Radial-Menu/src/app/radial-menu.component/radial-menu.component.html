<div class="container">
  <!-- <div class="background"></div> -->
  <svg class="radial-menu" viewBox="0 0 1000 1000">
    <defs>
      @for (segment of [].constructor(words.length); track $index) {
        @let segIdx = $index;
        @for (item of wordPositionsBySegment[segIdx]; track $index) {
          @let wordIdx = $index;
          <path
            [id]="'word-arc-' + segIdx + '-' + wordIdx"
            [attr.d]="getWordArcPath(item.arcRadius, item.startAngle, segIdx)"
          />
        }
      }
    </defs>

    @for (segment of [].constructor(words.length); track $index) {
      <path [attr.d]="getPathForSegment($index)" [class.hovered]="hoveredIndex === $index"></path>
    }

    @for (segment of [].constructor(words.length); track $index) {
      @let segIdx = $index;
      @for (item of wordPositionsBySegment[segIdx]; track $index) {
        @let wordIdx = $index;
        <text
          text-anchor="middle"
          dominant-baseline="middle"
          fill="white"
          font-family="Inter, Arial, sans-serif"
          font-size="13"
          font-weight="600"
          [class.word-visible]="hoveredIndex === segIdx"
          class="curved-word"
        >
          <textPath
            [attr.href]="'#word-arc-' + segIdx + '-' + wordIdx"
            startOffset="50%"
            text-anchor="middle"
          >
            {{ item.word }}
          </textPath>
        </text>
      }
    }
  </svg>
</div>
