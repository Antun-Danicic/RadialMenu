<svg #svgEl class="radial-menu" [attr.viewBox]="'0 0 ' + svgSize + ' ' + svgSize">
  <defs>
    @for (seg of segmentPaths; track $index) {
      @for (wp of seg.wordPaths; track wp.id) {
        <path [id]="wp.id" [attr.d]="wp.d" />
      }
      <path [id]="seg.labelPath.id" [attr.d]="seg.labelPath.d" />
    }
  </defs>

  @for (seg of segmentPaths; track $index) {
    <path [attr.d]="seg.d" [class.hovered]="hoveredIndex === $index" />
  }

  @for (seg of segmentPaths; track $index) {
    @let segIdx = $index;
    @let isHovered = hoveredIndex === segIdx;
    <text
      class="segment-label"
      [class.label-visible]="isHovered"
      [attr.font-size]="labelFontSize"
      [style.transform]="isHovered
        ? 'translate(0px, 0px)'
        : 'translate(' + svgToCssPx(seg.slideDx) + 'px, ' + svgToCssPx(seg.slideDy) + 'px)'"
    >
      <textPath [attr.href]="'#' + seg.labelPath.id" startOffset="50%" text-anchor="middle">
        {{ segments[segIdx].label }}
      </textPath>
    </text>
  }

  @for (seg of segmentPaths; track $index) {
    @let segIdx = $index;
    @for (entry of wordsBySegment[segIdx]; track entry.word) {
      @let wp = seg.wordPaths[$index];
      <text
        class="curved-word"
        [class.word-visible]="hoveredIndex === segIdx"
        [attr.font-size]="wordFontSize"
      >
        <textPath [attr.href]="'#' + wp.id" startOffset="50%" text-anchor="middle">
          {{ entry.word }}
        </textPath>
      </text>
    }
  }
</svg>
